filebeat.inputs:
  - type: filestream
    id: techsupport-api-logs
    paths:
      - /var/log/techsupport/*.log
    parsers:
      - ndjson:
          target: ''
          overwrite_keys: true
          add_error_key: true
          message_key: message

setup.ilm.enabled: false
setup.template.enabled: false
setup.template.name: logs-techsupport-api
setup.template.pattern: 'logs-techsupport-api-*'

output.elasticsearch:
  hosts: ['http://elasticsearch:9200']
  index: 'logs-techsupport-api-%{+yyyy.MM.dd}'

logging.level: info
